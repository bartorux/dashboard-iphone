name: Podsumowanie AI

# Hourly rather than at a fixed hour, and that is the answer to the timezone
# problem rather than a shrug at it: cron here is UTC while PSE publishes on
# Polish time, so any fixed hour would drift by one across the DST switch.
# Running every hour, the offset stops mattering — and inside the job every
# instant comes from `plan_dtime_utc`, the only PSE field that survives the
# autumn switch (`plan_dtime` carries a literal "03a" hour that cannot be parsed).
#
# Scheduled runs in Actions can be delayed under load, so "hourly" is an effort
# rather than a promise. Nothing downstream depends on punctuality: the card
# shows how old its text is, and hides it once it is too old to trust.
on:
  schedule:
    # The minute is arbitrary and moving it will not help. Moving from '5' to
    # '37' was meant to dodge the crowd at the top of the hour; a day of runs
    # afterwards landed at :02, :03, :56, :09, :54, :33, :01, :46, :29, :03, :35
    # — 15-30 minutes late regardless, scattered across the whole hour. GitHub
    # queues scheduled jobs when it has capacity, and the requested minute is a
    # hint.
    #
    # Nothing downstream depends on punctuality: the facts look forward, so they
    # are as valid mid-hour as on it, and the freshness canary catches a genuine
    # stall at 15 hours.
    - cron: '37 * * * *'
  workflow_dispatch:
  # The external heartbeat. GitHub's own scheduler delivered this cron 5 times
  # in 2 days instead of 48 (measured 26-28.08.2026: gaps of 10-11 hours), and
  # the card went stale for longer than its own 12-hour display cutoff. An
  # external cron (cron-job.org) POSTs to /repos/.../dispatches hourly with a
  # fine-grained PAT that lives only there; the schedule above stays as a free
  # second chance, and decideRun already makes redundant runs cost nothing.
  repository_dispatch:
    types: [odswiez-podsumowanie]

permissions:
  contents: write
  issues: read

concurrency:
  group: summary
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  summary:
    runs-on: ubuntu-latest
    # Ponowienia moga dolozyc do ~130 s przy pelnej porazce; mediana przebiegu
    # to 63 s, maksimum 295 s. Limit jest po to, zeby zawieszony runner nie
    # blokowal kolejki `concurrency` przez cala godzine.
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Writes public/summary.json only when the assessment has changed and the
      # answer passes validation. Exits 0 either way: a scheduled job must not go
      # red because the model was briefly unavailable.
      - name: Wygeneruj podsumowanie
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/summary.ts

      # The commit is for durability — the summary and the assessment it rests on
      # stay in history. It is NOT what publishes: a push made with GITHUB_TOKEN
      # deliberately triggers no further workflow, so `deploy.yml` never sees it.
      # Delivery is the job below, which runs only when this step changed something.
      #
      # Everything under data/ rides along in the commit, but only summary.json
      # publishes. The forecast log and the text log are written most hours and
      # are read by nothing but the next run of this script and a person going
      # back over a day of drafts; letting either trigger the deploy would
      # rebuild the site — and churn the service worker on every phone — for
      # files no phone downloads.
      - name: Zapisz, jesli sie zmienilo
        id: publish
        run: |
          # --porcelain, not `git diff`: the log is untracked on the first run
          # ever, and `git diff` says nothing about a file git has not seen.
          summary_changed=$([ -n "$(git status --porcelain -- public/summary.json)" ] && echo yes || echo no)
          log_changed=$([ -n "$(git status --porcelain -- data)" ] && echo yes || echo no)

          # `changed` is written exactly once, on whichever path the step takes,
          # and never before the push. It decides whether the deploy job runs, so
          # setting it early would publish a commit that failed to leave here. If
          # this step dies the output stays unset, which reads as false — the safe
          # direction.
          if [ "$summary_changed" = no ] && [ "$log_changed" = no ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ani podsumowanie, ani log sie nie zmienily — nie commituje."
            exit 0
          fi

          if [ "$summary_changed" = no ]; then
            echo "Ruszyly sie tylko logi — commituje bez publikacji."
            wiadomosc="Zapisz przebieg podsumowania"
          else
            wiadomosc="Odswiez podsumowanie"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f public/summary.json ]; then git add public/summary.json; fi
          if [ -d data ]; then git add data; fi
          git commit -m "$wiadomosc"

          # Jedno podejscie: dociagnij, przenies nasz commit, oddaj. `fetch` +
          # `rebase` zamiast `pull --rebase`, zeby kazda faze dalo sie
          # rozroznic i zeby zadna konfiguracja `pull.rebase` nie zmieniala tu
          # zachowania.
          sprobuj() {
            git fetch --no-tags --quiet origin "$GITHUB_REF_NAME" || return 1

            # Najpierw rebase bez zadnych rozstrzygniec, zeby konflikt byl
            # WIDOCZNY. Archiwa JSONL i tak nie skonfliktuja — .gitattributes
            # laczy je sterownikiem union — wiec to ostrzezenie zapali sie
            # tylko dla plikow przepisywanych w calosci, czyli dokladnie tam,
            # gdzie warto na nie spojrzec.
            if ! git rebase --quiet FETCH_HEAD; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "::warning title=Konflikt przy zapisie::Ktos ruszyl te same pliki na ${GITHUB_REF_NAME}. Rozstrzygam na korzysc tego przebiegu — jego dane sa swiezsze."
              # UWAGA na odwrocenie: przy rebase "ours" to galaz docelowa
              # (zdalna), a "theirs" to przenoszony commit, czyli NASZ. Wiec
              # `-X theirs` znaczy "zachowaj wersje tego przebiegu". Zmierzone
              # na kopii repozytorium, nie wywnioskowane.
              git rebase --quiet -X theirs FETCH_HEAD || {
                git rebase --abort >/dev/null 2>&1 || true
                return 1
              }
            fi

            git push --quiet origin "HEAD:${GITHUB_REF_NAME}" || return 1
          }

          # Cztery podejscia, przerwy 10/30/90 s. Zmierzone 09.09.2026: 3
          # padniecia na 95 przebiegow, wszystkie na tym kroku. Skonczona lista
          # prob, nie `while`: przy bledzie trwalym ten krok ma sie poddac
          # glosno, a nie zajac runnera. `git rebase --abort` po kazdej
          # nieudanej probie gwarantuje, ze kolejna zaczyna od naszego commita
          # na starej bazie, a nie od polowy rebase'u.
          udalo=nie
          for przerwa in 10 30 90 koniec; do
            if sprobuj; then udalo=tak; break; fi
            [ "$przerwa" = koniec ] && break
            echo "::notice title=Ponawiam zapis::Nie udalo sie oddac commita; kolejne podejscie za ${przerwa} s."
            sleep "$przerwa"
          done

          if [ "$udalo" != tak ]; then
            echo "::error title=Odczyt przepadl::Cztery podejscia do rebase i push na ${GITHUB_REF_NAME} nie powiodly sie. Przepadl odczyt archiwum z tego kwadransa — a to jedyny zapis tego, co prognoza mowila w tej chwili, bo PSE nie wersjonuje pk5l-wp."
            exit 1
          fi

          if [ "$summary_changed" = yes ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Publishes the site itself rather than hoping the commit above wakes the deploy
  # workflow — it cannot. Gated on an actual change, so a quiet hour costs nothing
  # and the service worker is not churned on the phone for identical content.
  deploy:
    needs: summary
    if: needs.summary.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Same group as deploy.yml, so a code deploy and a summary deploy queue up
    # behind each other instead of racing for Pages.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The branch head, not the SHA that triggered the schedule — the summary
      # commit landed after this run began.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
