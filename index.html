<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PSE Dashboard - Monitoring rezerw mocy KSE" />
    <!-- The app bar's solid surface per theme (--l/--d-material-solid in App.css).
         useThemeColorMeta rewrites both when a theme is forced in the settings. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` lets iOS tint the status bar from theme-color; `black-translucent`
         pushes content under the clock and ignores it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PSE Dashboard" />
    <!-- iOS ignores manifest icons, does not support SVG here, and never re-reads
         this after the app is added to the home screen — it must be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>PSE Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
